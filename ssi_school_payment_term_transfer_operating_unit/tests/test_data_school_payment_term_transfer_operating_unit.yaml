scenarios:
  - name: "School Payment Term Transfer - Operating Unit derivation and visibility"
    steps:
      # ---------------------------------------------------------------
      # Fixtures — two Operating Units, two Schools, two Enrollments.
      # Two different Operating Units are used throughout so the record
      # rule is actually exercised, not passed by coincidence.
      # ---------------------------------------------------------------
      - step: "Create partner for Operating Unit A"
        action: "create"
        model: "res.partner"
        save_as: "ou_a_partner"
        values:
          name: "PTTOU Operating Unit A Partner"

      - step: "Create Operating Unit A"
        action: "create"
        model: "operating.unit"
        save_as: "operating_unit_a"
        values:
          name: "TOUR PTTOU Operating Unit A"
          code: "PTTOUA"
          partner_id: "REC: ou_a_partner.id"

      - step: "Create partner for Operating Unit B"
        action: "create"
        model: "res.partner"
        save_as: "ou_b_partner"
        values:
          name: "PTTOU Operating Unit B Partner"

      - step: "Create Operating Unit B"
        action: "create"
        model: "operating.unit"
        save_as: "operating_unit_b"
        values:
          name: "PTTOU Operating Unit B"
          code: "PTTOUB"
          partner_id: "REC: ou_b_partner.id"

      - step: "Create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "PTTOU Grade Type"
          code: "PTTOUGT"

      - step: "Create School A, restricted to Operating Unit A"
        action: "create"
        model: "school"
        save_as: "school_a"
        values:
          name: "PTTOU School A"
          code: "PTTOUSCA"
          grade_type_id: "REC: grade_type.id"
          operating_unit_ids: [[6, 0, ["REC: operating_unit_a.id"]]]

      - step: "Create School B, restricted to Operating Unit B"
        action: "create"
        model: "school"
        save_as: "school_b"
        values:
          name: "PTTOU School B"
          code: "PTTOUSCB"
          grade_type_id: "REC: grade_type.id"
          operating_unit_ids: [[6, 0, ["REC: operating_unit_b.id"]]]

      - step: "Create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "PTTOU Academic Year"
          code: "PTTOUAY"
          date_start: "2026-07-01"
          date_end: "2027-06-30"

      - step: "Create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "PTTOU Academic Term"
          code: "PTTOUTM"
          date_start: "2026-07-01"
          date_end: "2026-12-31"
          year_id: "REC: academic_year.id"

      - step: "Create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "PTTOU Grade"
          code: "PTTOUGR"
          type_id: "REC: grade_type.id"

      - step: "Create Grade Class for School A"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class_a"
        values:
          name: "PTTOU Class A"
          code: "PTTOUCLA"
          school_id: "REC: school_a.id"
          grade_id: "REC: grade.id"

      - step: "Create Grade Class for School B"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class_b"
        values:
          name: "PTTOU Class B"
          code: "PTTOUCLB"
          school_id: "REC: school_b.id"
          grade_id: "REC: grade.id"

      - step: "Create Student A's contact"
        action: "create"
        model: "res.partner"
        save_as: "contact_a"
        values:
          name: "PTTOU Contact A"

      - step: "Create Student A, in School A"
        action: "create"
        model: "school_student"
        save_as: "student_a"
        values:
          name: "PTTOU Student A"
          code: "PTTOUSTA"
          contact_id: "REC: contact_a.id"
          school_id: "REC: school_a.id"

      - step: "Create Student B's contact"
        action: "create"
        model: "res.partner"
        save_as: "contact_b"
        values:
          name: "PTTOU Contact B"

      - step: "Create Student B, in School B"
        action: "create"
        model: "school_student"
        save_as: "student_b"
        values:
          name: "PTTOU Student B"
          code: "PTTOUSTB"
          contact_id: "REC: contact_b.id"
          school_id: "REC: school_b.id"

      - step: "Create Enrollment A, targeting School A"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment_a"
        values:
          academic_year_id: "REC: academic_year.id"
          academic_term_id: "REC: academic_term.id"
          school_id: "REC: school_a.id"
          grade_id: "REC: grade.id"
          grade_class_id: "REC: grade_class_a.id"
          student_id: "REC: student_a.id"

      - step: "Enrollment A derives Operating Unit A from its School"
        action: "assert"
        target: "enrollment_a"
        asserts:
          operating_unit_id:
            type: "m2o"
            expected: "REC: operating_unit_a"

      - step: "Create Enrollment B, targeting School B"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment_b"
        values:
          academic_year_id: "REC: academic_year.id"
          academic_term_id: "REC: academic_term.id"
          school_id: "REC: school_b.id"
          grade_id: "REC: grade.id"
          grade_class_id: "REC: grade_class_b.id"
          student_id: "REC: student_b.id"

      - step: "Enrollment B derives Operating Unit B from its School"
        action: "assert"
        target: "enrollment_b"
        asserts:
          operating_unit_id:
            type: "m2o"
            expected: "REC: operating_unit_b"

      - step: "Create shared transfer reason"
        action: "create"
        model: "school_payment_term_transfer_reason"
        save_as: "reason"
        values:
          name: "PTTOU Reason"
          code: "/"

      - step: "Create Source Term on Enrollment A"
        action: "create"
        model: "school_enrollment_payment_term"
        save_as: "source_term_a"
        values:
          enrollment_id: "REC: enrollment_a.id"
          name: "PTTOU Source Term A"

      - step: "Create Destination Term on Enrollment A"
        action: "create"
        model: "school_enrollment_payment_term"
        save_as: "destination_term_a"
        values:
          enrollment_id: "REC: enrollment_a.id"
          name: "PTTOU Destination Term A"

      - step: "Create Source Term on Enrollment B"
        action: "create"
        model: "school_enrollment_payment_term"
        save_as: "source_term_b"
        values:
          enrollment_id: "REC: enrollment_b.id"
          name: "PTTOU Source Term B"

      - step: "Create Destination Term on Enrollment B"
        action: "create"
        model: "school_enrollment_payment_term"
        save_as: "destination_term_b"
        values:
          enrollment_id: "REC: enrollment_b.id"
          name: "PTTOU Destination Term B"

      # ---------------------------------------------------------------
      # Positive — deriving operating_unit_id from enrollment_id
      # ---------------------------------------------------------------
      - step: "Create a transfer on Enrollment A without operating_unit_id"
        action: "create"
        model: "school_payment_term_transfer"
        save_as: "doc_derive_a"
        values:
          enrollment_id: "REC: enrollment_a.id"
          reason_id: "REC: reason.id"
          source_term_id: "REC: source_term_a.id"
          destination_term_id: "REC: destination_term_a.id"

      - step: "It derived Operating Unit A from the Enrollment"
        action: "assert"
        target: "doc_derive_a"
        asserts:
          operating_unit_id:
            type: "m2o"
            expected: "REC: operating_unit_a"

      # ---------------------------------------------------------------
      # Positive — an explicit operating_unit_id wins over derivation
      # ---------------------------------------------------------------
      - step:
          "Create a transfer on Enrollment A with operating_unit_id set explicitly to B"
        action: "create"
        model: "school_payment_term_transfer"
        save_as: "doc_explicit"
        values:
          enrollment_id: "REC: enrollment_a.id"
          reason_id: "REC: reason.id"
          source_term_id: "REC: source_term_a.id"
          destination_term_id: "REC: destination_term_a.id"
          operating_unit_id: "REC: operating_unit_b.id"

      - step: "The explicit value is kept, not overridden by derivation"
        action: "assert"
        target: "doc_explicit"
        asserts:
          operating_unit_id:
            type: "m2o"
            expected: "REC: operating_unit_b"

      # ---------------------------------------------------------------
      # Positive — write() re-derives operating_unit_id when
      # enrollment_id itself changes
      # ---------------------------------------------------------------
      - step: "Change doc_derive_a's Enrollment to Enrollment B"
        action: "write"
        target: "doc_derive_a"
        values:
          enrollment_id: "REC: enrollment_b.id"

      - step: "operating_unit_id followed the Enrollment to B"
        action: "assert"
        target: "doc_derive_a"
        asserts:
          operating_unit_id:
            type: "m2o"
            expected: "REC: operating_unit_b"

      # ---------------------------------------------------------------
      # Positive — @api.onchange mirrors the create/write derivation,
      # so the form shows the right value before the record is saved
      # ---------------------------------------------------------------
      - step: "Selecting Enrollment A on the form derives Operating Unit A"
        action: "form"
        model: "school_payment_term_transfer"
        save: false
        values:
          enrollment_id: "REC: enrollment_a"
          reason_id: "REC: reason"
          source_term_id: "REC: source_term_a"
          destination_term_id: "REC: destination_term_a"
        asserts:
          operating_unit_id:
            type: "m2o"
            expected: "REC: operating_unit_a"

      # ---------------------------------------------------------------
      # Fixtures for the record rule scenarios — one document per
      # Operating Unit, and a user restricted to Operating Unit A only.
      # ---------------------------------------------------------------
      - step: "Create the Operating Unit A visibility fixture document"
        action: "create"
        model: "school_payment_term_transfer"
        save_as: "doc_vis_a"
        values:
          enrollment_id: "REC: enrollment_a.id"
          reason_id: "REC: reason.id"
          source_term_id: "REC: source_term_a.id"
          destination_term_id: "REC: destination_term_a.id"

      - step: "Create the Operating Unit B visibility fixture document"
        action: "create"
        model: "school_payment_term_transfer"
        save_as: "doc_vis_b"
        values:
          enrollment_id: "REC: enrollment_b.id"
          reason_id: "REC: reason.id"
          source_term_id: "REC: source_term_b.id"
          destination_term_id: "REC: destination_term_b.id"

      - step: "Create a user restricted to Operating Unit A only"
        action: "create"
        model: "res.users"
        save_as: "user_ou_a"
        values:
          name: "PTTOU User OU A"
          login: "pttou_user_ou_a@example.com"
          groups_id:
            [
              [
                6,
                0,
                [
                  "REF: base.group_user",
                  "REF:
                  ssi_school_payment_term_transfer_operating_unit.school_payment_term_transfer_operating_unit_group",
                ],
              ],
            ]
          assigned_operating_unit_ids: [[6, 0, ["REC: operating_unit_a.id"]]]

      # ---------------------------------------------------------------
      # Positive — search as a user of Operating Unit A only returns
      # the Operating Unit A document
      # ---------------------------------------------------------------
      - step: "Search both documents as User OU A"
        action: "search"
        model: "school_payment_term_transfer"
        domain: [["id", "in", ["REC: doc_vis_a.id", "REC: doc_vis_b.id"]]]
        as_user: "user_ou_a"
        save_as: "visible_docs"
        expect_count: 1

      - step: "The one visible document is the Operating Unit A document"
        action: "assert"
        target: "visible_docs"
        asserts:
          id:
            type: "value"
            expected: "REC: doc_vis_a.id"

      # ---------------------------------------------------------------
      # Negative — reading the Operating Unit B document directly by
      # id, as a user restricted to Operating Unit A, is denied
      # ---------------------------------------------------------------
      - step: "Reading the Operating Unit B document directly is denied"
        action: "call"
        target: "doc_vis_b"
        method: "read"
        as_user: "user_ou_a"
        args:
          - ["id"]
        expect_error:
          type: "AccessError"
